server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

upload-file:
  # Root dir for chunks and merged files
  storage-dir: ./data/upload
  # Task metadata persistence dir (tasks survive restarts when set)
  metadata-dir: ./data/upload/meta
  verify-checksum: true
  upload-url: /upload
  download-url: /download

  # Async merge: the frontend "Async Merge" button submits action=mergeAsync and polls action=mergeStatus.
  async-merge:
    enabled: true
    thread-pool-size: 2

  # --- rc.6 commercial-wiring example (security & audit alignment) ---
  # Endpoints: download is OFF by default now; this demo enables it explicitly.
  endpoint:
    upload-enabled: true
    download-enabled: true
  # Uniform failure body with a stable symbolic code (UploadHttpError) instead of the legacy
  # per-endpoint empty models.
  http:
    error-body: standard
    # cancel-not-found-status: 200      # optional: treat canceling a missing task as an idempotent 200
  # Structured access-decision log. rc.8: scope defaults to "task" (deny + task-level events), so a
  # large upload no longer logs one line per chunk — only the first chunk of each task is logged; set
  # "all" to restore the rc.7 per-decision log or "deny" for denies only.
  observability:
    access-log: true
    access-log-scope: task
  # rc.8: with the "enterprise" profile active, EnterpriseWiringConfig provides an UploadErrorRenderer
  # bean, so every failure body is the host's ApiResponse{success,code,message,data} (the bean wins
  # over http.error-body). Success bodies are unchanged. Try it with:
  #   mvn -pl example/upload-file-boot4-demo spring-boot:run -Dspring-boot.run.profiles=enterprise
  # then POST /upload with ?token=deny-me to receive a unified failure envelope with HTTP 403.
  # For a real owner check (401 vs 403) define an AccessControl bean that overrides decide(...)
  # and returns AccessDecision.deny(403, reason) on an ownership mismatch; an AccessControlListener
  # bean can write your own audit rows. A ready-made example lives in EnterpriseWiringConfig:
  #   mvn -pl example/upload-file-boot4-demo spring-boot:run -Dspring-boot.run.profiles=enterprise
  # then call any endpoint with ?token=deny-me to receive a 403.

  # --- rc.3 production-hardening examples (commented out). The demo endpoints stay open, but the
  # rc.9 defaults already bound them: max-chunk-size is 10 MB and startup fails fast when no limit
  # is configured at all. ---
  # Optional access control: enable + a token, then every endpoint requires the token
  # in the "X-Access-Token" header (or a "token" query param).
  #security:
  #  enabled: true
  #  token: change-me
  #  header-name: X-Access-Token
  # Per-file total size limit (bytes) and optional global capacity quota (bytes).
  #max-file-size: 1073741824
  #quota:
  #  max-bytes: 10737418240
  # Cleanup observability / multi-instance scheduling lock.
  #observability:
  #  log-stats: true
  #cleanup:
  #  enabled: true
  #  use-redis-lock: true
