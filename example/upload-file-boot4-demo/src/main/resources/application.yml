server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

upload-file:
  # Root dir for chunks and merged files
  storage-dir: ./data/upload
  # Task metadata persistence dir (tasks survive restarts when set)
  metadata-dir: ./data/upload/meta
  verify-checksum: true
  upload-url: /upload
  download-url: /download

  # Async merge: the frontend "Async Merge" button submits action=mergeAsync and polls action=mergeStatus.
  async-merge:
    enabled: true
    thread-pool-size: 2

  # --- rc.3 production-hardening examples (commented out, keep defaults to stay open) ---
  # Optional access control: enable + a token, then every endpoint requires the token
  # in the "X-Access-Token" header (or a "token" query param).
  #security:
  #  enabled: true
  #  token: change-me
  #  header-name: X-Access-Token
  # Per-file total size limit (bytes) and optional global capacity quota (bytes).
  #max-file-size: 1073741824
  #quota:
  #  max-bytes: 10737418240
  # Cleanup observability / multi-instance scheduling lock.
  #observability:
  #  log-stats: true
  #cleanup:
  #  enabled: true
  #  use-redis-lock: true
